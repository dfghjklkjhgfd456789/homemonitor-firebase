<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebStream Precision Control</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-card">
        <header class="header">
            <div class="logo">
                <span class="icon">🎯</span>
                <h1>WebStream Precision</h1>
            </div>
            <span id="statusBadge" class="badge badge-checking">Checking...</span>
        </header>

        <section class="panel">
            <div class="info-row">
                <span class="label">Target Origin:</span>
                <span id="originVal" class="value">Checking...</span>
            </div>
            <div class="info-row">
                <span class="label">Viewer Status:</span>
                <span id="viewerStatusVal" class="value">Detecting...</span>
            </div>
            <div class="info-row">
                <span class="label">Intrinsic Resolution:</span>
                <span id="naturalResVal" class="value">-</span>
            </div>
            <div class="info-row">
                <span class="label">Rendered Bounds:</span>
                <span id="renderedResVal" class="value">-</span>
            </div>
            <div class="info-row">
                <span class="label">Device Pixel Ratio:</span>
                <span id="dprVal" class="value">-</span>
            </div>
        </section>

        <section class="controls">
            <label class="toggle-container">
                <input type="checkbox" id="overlayToggle" checked>
                <span class="toggle-slider"></span>
                <span class="toggle-label">Enable Diagnostics Overlay</span>
            </label>
        </section>

        <footer class="footer">
            <button id="refreshBtn" class="btn btn-secondary">🔄 Refresh</button>
            <button id="optionsBtn" class="btn btn-primary">⚙️ Settings</button>
        </footer>

        <div class="notice">
            <span>Notice: Precision overlay active. E3/E4 coordinate pipeline pending.</span>
        </div>
    </div>
    <script type="module" src="popup.js"></script>
</body>
</html>
