<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebStream Coordinate Engine Test Fixture</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; padding: 20px; }
        .fixture-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .fixture-box { background: #1e293b; border: 2px solid #334155; padding: 10px; border-radius: 8px; }
        .fixture-title { font-weight: bold; margin-bottom: 8px; color: #38bdf8; font-size: 12px; }
        .viewer-container { width: 300px; height: 500px; background: #000; position: relative; border: 4px solid #475569; overflow: hidden; }

        img.test-stream { display: block; width: 100%; height: 100%; }

        .fit-contain { object-fit: contain; object-position: center center; }
        .fit-cover { object-fit: cover; object-position: center center; }
        .fit-fill { object-fit: fill; }
        .fit-top-left { object-fit: contain; object-position: top left; }
        .fit-padded { padding: 20px; box-sizing: border-box; object-fit: contain; }
    </style>
</head>
<body>
    <h1>WebStream Precision Control - Synthetic Coordinate Test Fixture</h1>
    <div class="fixture-grid">
        <div class="fixture-box">
            <div class="fixture-title">1. Standard Portrait Contain (1080x2400)</div>
            <div class="viewer-container">
                <img id="stream" class="test-stream fit-contain" src="/stream" alt="Portrait Stream" />
            </div>
        </div>

        <div class="fixture-box">
            <div class="fixture-title">2. Cover Mode</div>
            <div class="viewer-container">
                <img class="test-stream fit-cover" src="/stream" alt="Cover Stream" />
            </div>
        </div>

        <div class="fixture-box">
            <div class="fixture-title">3. Top Left Object Position</div>
            <div class="viewer-container">
                <img class="test-stream fit-top-left" src="/stream" alt="Top Left Stream" />
            </div>
        </div>

        <div class="fixture-box">
            <div class="fixture-title">4. Padded & Border Box Container</div>
            <div class="viewer-container">
                <img class="test-stream fit-padded" src="/stream" alt="Padded Stream" />
            </div>
        </div>
    </div>
</body>
</html>
